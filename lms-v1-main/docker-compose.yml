services:

  # PostgreSQL Database
  local-db:
    image: postgres:16
    container_name: local-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - local-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  api-server:
    image: lms-public-api
    build:
      context: ./api
    container_name: api-server
    environment:
      MODE: local
      PORT: 3000
      DATABASE_URL: postgresql://postgres:password@local-db:5432/mydb
    ports:
      - "3000:3000"
    restart: on-failure
    depends_on:
      local-db:
        condition: service_healthy

  # Frontend Web Application
  web-server:
    image: lms-web
    build:
      context: ./webapp
    container_name: web-server
    ports:
      - "80:80"
    depends_on:
      - api-server
    restart: unless-stopped

# Named volume for database persistence
volumes:
  local-db-data:
